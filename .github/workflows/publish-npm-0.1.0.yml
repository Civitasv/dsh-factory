name: Publish Orven 0.1.0

on:
  push:
    branches:
      - release/npm-0.1.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate release artifacts
        run: pnpm distribution:check

      - name: Pack public packages
        run: |
          mkdir -p release-artifacts
          pnpm --dir packages/core pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          pnpm --dir packages/plugin-dsh pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          ls -lah release-artifacts

      - name: Upload packed packages
        uses: actions/upload-artifact@v4
        with:
          name: orven-0.1.0-packages
          path: release-artifacts/*.tgz
          if-no-files-found: error

      - name: Publish @orven/core
        run: npm publish "$(ls release-artifacts/orven-core-*.tgz)" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @orven/plugin-dsh
        run: npm publish "$(ls release-artifacts/orven-plugin-dsh-*.tgz)" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
